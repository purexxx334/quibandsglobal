<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Quibands Global | Institutional-Grade Cryptocurrency Mining Platform</title>
    <meta name="description" content="Next-generation high-efficiency institutional crypto mining infrastructure. Transparent hashrate allocation, real-time yield distribution, and multi-signature cold storage security." />
    
    <!-- Open Graph / Facebook / WhatsApp / Telegram Social Previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quibands Global" />
    <meta property="og:title" content="Quibands Global | Institutional-Grade Cryptocurrency Mining" />
    <meta property="og:description" content="Next-generation high-efficiency institutional crypto mining infrastructure. Real-time hashrate allocation, automated balance distribution, and multi-signature cold custody." />
    <meta property="og:image" content="/og-preview.png" />
    <meta property="og:image:secure_url" content="/og-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Quibands Global Institutional Infrastructure" />

    <!-- Twitter Social Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quibands Global | Institutional-Grade Cryptocurrency Mining" />
    <meta name="twitter:description" content="Next-generation high-efficiency institutional crypto mining infrastructure. Real-time hashrate allocation, automated balance distribution, and multi-signature cold custody." />
    <meta name="twitter:image" content="/og-preview.png" />

    <!-- Smartsupp Live Chat script -->
    <script type="text/javascript">
    var _smartsupp = _smartsupp || {};
    _smartsupp.key = '3cdeb6680f2bbdf23ceab58462afab7133653b98';
    _smartsupp.hideOffline = false;
    _smartsupp.chatBubble = true;
    window.smartsupp||(function(d) {
      var s,c,o=smartsupp=function(){ o._.push(arguments)};o._=[];
      s=d.getElementsByTagName('script')[0];c=d.createElement('script');
      c.type='text/javascript';c.charset='utf-8';c.async=true;
      c.src='https://www.smartsuppchat.com/loader.js?';s.parentNode.insertBefore(c,s);
    })(document);
    </script>
  </head>

  <body class="bg-dark-950 text-slate-100 font-sans antialiased selection:bg-gold-500/30 selection:text-gold-300 overflow-x-hidden min-h-screen w-full touch-pan-y">
    <!-- Google Translate Zero-Footprint Bridge Container -->
    <div id="google_translate_element" style="position: fixed; top: 0; left: 0; width: 0; height: 0; overflow: hidden; opacity: 0; pointer-events: none; z-index: -99999;"></div>

    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            autoDisplay: false,
            includedLanguages: 'en,zh-CN,zh-TW,ms,ta,es,de,fr,ja,ko,ar,pt,ru,vi,id,th,tl,tr,it',
            layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE
          }, 'google_translate_element');
        }
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Floating In-Page Smartsupp Chat Modal (Guaranteed Mobile + PC) -->
    <div id="qb-chat-modal" style="display: none; position: fixed; inset: 0; z-index: 2147483647; background: rgba(0,0,0,0.6); backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);">
      <div style="position: absolute; bottom: 0; right: 0; width: 100%; max-width: 420px; height: 85vh; max-height: 700px; background: #0f172a; border-radius: 16px 16px 0 0; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 -10px 40px rgba(0,0,0,0.8); border: 1px solid rgba(255,255,255,0.1);">
        <!-- Modal Header with Close Button -->
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 12px 18px; background: #1e293b; border-bottom: 1px solid rgba(255,255,255,0.08);">
          <div style="display: flex; align-items: center; gap: 8px;">
            <div style="width: 10px; height: 10px; border-radius: 50%; background: #10b981; box-shadow: 0 0 8px #10b981;"></div>
            <span style="color: #ffffff; font-weight: 600; font-size: 14px; font-family: sans-serif;">Live Support</span>
          </div>
          <button id="qb-chat-close-btn" type="button" style="background: rgba(255,255,255,0.1); border: none; color: #ffffff; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 18px;">✕</button>
        </div>
        <!-- Smartsupp Embedded Frame with full interaction & permissions -->
        <iframe
          id="qb-chat-frame"
          src="about:blank"
          style="width: 100%; height: 100%; border: none; background: #ffffff; flex: 1;"
          title="Live Chat"
          allow="microphone; camera; clipboard-write; autoplay"
          sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals allow-downloads"
        ></iframe>
      </div>
    </div>

    <!-- Floating Live Chat Trigger Button -->
    <button
      id="qb-live-chat-btn"
      type="button"
      style="
        position: fixed !important;
        bottom: 24px !important;
        right: 24px !important;
        width: 60px !important;
        height: 60px !important;
        border-radius: 50% !important;
        background: linear-gradient(135deg, #1d4ed8, #06b6d4) !important;
        border: none !important;
        outline: none !important;
        cursor: pointer !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        box-shadow: 0 6px 25px rgba(29, 78, 216, 0.75) !important;
        z-index: 2147483640 !important;
        -webkit-tap-highlight-color: transparent !important;
        touch-action: manipulation !important;
      "
      aria-label="Open Live Chat"
      title="Open Live Chat"
    >
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events: none;">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
    </button>

    <script type="text/javascript">
      (function() {
        var modal = document.getElementById('qb-chat-modal');
        var frame = document.getElementById('qb-chat-frame');
        var openBtn = document.getElementById('qb-live-chat-btn');
        var closeBtn = document.getElementById('qb-chat-close-btn');

        function openChatModal() {
          // If on desktop and Smartsupp native opened, use native
          if (window.smartsupp && window.innerWidth > 768) {
            try {
              window.smartsupp('chat:open');
              return;
            } catch(e) {}
          }

          // Guaranteed in-page floating modal for mobile / fallback
          if (modal) {
            if (frame && frame.src === 'about:blank') {
              var smartsuppHtml = '<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><style>html,body{margin:0;padding:0;width:100%;height:100%;background:#ffffff;overflow:hidden;}</style></head><body>' +
                '<script type="text/javascript">' +
                'var _smartsupp = _smartsupp || {};' +
                '_smartsupp.key = "3cdeb6680f2bbdf23ceab58462afab7133653b98";' +
                '_smartsupp.hideOffline = false;' +
                '_smartsupp.chatBubble = false;' +
                '_smartsupp.open = true;' +
                'window.smartsupp||(function(d){var s,c,o=smartsupp=function(){o._.push(arguments)};o._=[];s=d.getElementsByTagName("script")[0];c=d.createElement("script");c.type="text/javascript";c.charset="utf-8";c.async=true;c.src="https://www.smartsuppchat.com/loader.js?";s.parentNode.insertBefore(c,s);})(document);' +
                'var checkCount=0; var checkInt = setInterval(function(){ checkCount++; if(window.smartsupp){ try{ window.smartsupp("chat:open"); }catch(e){} } if(checkCount>30) clearInterval(checkInt); }, 300);' +
                '<\/script></body></html>';
              frame.srcdoc = smartsuppHtml;
            }
            modal.style.display = 'block';
            if (openBtn) openBtn.style.display = 'none';
          }
        }

        function closeChatModal() {
          if (modal) {
            modal.style.display = 'none';
            if (openBtn) openBtn.style.display = 'flex';
          }
        }

        if (openBtn) {
          openBtn.onclick = function(e) {
            if (e && e.preventDefault) e.preventDefault();
            openChatModal();
          };
          openBtn.ontouchend = function(e) {
            if (e && e.preventDefault) e.preventDefault();
            openChatModal();
          };
        }

        if (closeBtn) {
          closeBtn.onclick = function(e) {
            if (e && e.preventDefault) e.preventDefault();
            closeChatModal();
          };
          closeBtn.ontouchend = function(e) {
            if (e && e.preventDefault) e.preventDefault();
            closeChatModal();
          };
        }

        if (modal) {
          modal.onclick = function(e) {
            if (e.target === modal) {
              closeChatModal();
            }
          };
        }
      })();
    </script>
  </body>
</html>

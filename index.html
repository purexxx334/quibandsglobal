  <body class="bg-dark-950 text-slate-100 font-sans antialiased selection:bg-gold-500/30 selection:text-gold-300 overflow-x-hidden min-h-screen w-full touch-pan-y">
    <!-- Google Translate Zero-Footprint Bridge Container -->
    <div id="google_translate_element" style="position: fixed; top: 0; left: 0; width: 0; height: 0; overflow: hidden; opacity: 0; pointer-events: none; z-index: -99999;"></div>

    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            autoDisplay: false,
            includedLanguages: 'en,zh-CN,zh-TW,ms,ta,es,de,fr,ja,ko,ar,pt,ru,vi,id,th,tl,tr,it',
            layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE
          }, 'google_translate_element');
        }
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Smartsupp Live Chat script -->
    <script type="text/javascript">
    var _smartsupp = _smartsupp || {};
    _smartsupp.key = '3cdeb6680f2bbdf23ceab58462afab7133653b98';
    _smartsupp.hideOffline = false;
    window.smartsupp||(function(d) {
      var s,c,o=smartsupp=function(){ o._.push(arguments)};o._=[];
      s=d.getElementsByTagName('script')[0];c=d.createElement('script');
      c.type='text/javascript';c.charset='utf-8';c.async=true;
      c.src='https://www.smartsuppchat.com/loader.js?';s.parentNode.insertBefore(c,s);
    })(document);
    </script>

    <!--
      GUARANTEED CHAT BUTTON
      All styles are 100% inline — no CSS class, no framework.
      Nothing in the project can override or hide this button.
    -->
    <button
      id="qb-live-chat"
      style="
        position:fixed !important;
        bottom:24px !important;
        right:24px !important;
        z-index:2147483647 !important;
        width:60px !important;
        height:60px !important;
        border-radius:50% !important;
        background:linear-gradient(135deg,#1d4ed8,#06b6d4) !important;
        border:none !important;
        outline:none !important;
        cursor:pointer !important;
        display:flex !important;
        align-items:center !important;
        justify-content:center !important;
        box-shadow:0 4px 24px rgba(29,78,216,0.7) !important;
        padding:0 !important;
        margin:0 !important;
        visibility:visible !important;
        opacity:1 !important;
        pointer-events:auto !important;
        transform:none !important;
        overflow:visible !important;
      "
      title="Live Support Chat"
      aria-label="Open live support chat"
    >
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
        stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
        style="display:block !important; pointer-events:none !important;">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </button>

    <script>
      (function() {
        var btn = document.getElementById('qb-live-chat');
        if (!btn) return;

        var chatOpened = false;

        // Check if Smartsupp has fully initialised its iframe in the DOM
        function smartsuppReady() {
          return !!(
            document.getElementById('chat-application') ||
            document.querySelector('iframe[src*="smartsuppchat"]') ||
            document.querySelector('div[id*="smartsupp"]')
          );
        }

        // Open Smartsupp chat using its API
        function openViaAPI() {
          try {
            if (typeof window.smartsupp === 'function') {
              window.smartsupp('chat:open');
              chatOpened = true;
              return true;
            }
          } catch(e) {}
          return false;
        }

        // Fallback: open chat in a new tab (works reliably on mobile)
        function openViaTab() {
          var a = document.createElement('a');
          a.href = 'https://app.smartsupp.com/chat/3cdeb6680f2bbdf23ceab58462afab7133653b98';
          a.target = '_blank';
          a.rel = 'noopener';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }

        // Once Smartsupp loads, hide its native launcher so only our button is visible
        var hideAttempts = 0;
        var hideInterval = setInterval(function() {
          hideAttempts++;
          if (smartsuppReady()) {
            clearInterval(hideInterval);
            try {
              if (typeof window.smartsupp === 'function') {
                window.smartsupp('chat:hide');
              }
            } catch(e) {}
          }
          // Give up after 20 seconds
          if (hideAttempts > 100) clearInterval(hideInterval);
        }, 200);

        // Main click handler — works on both PC and mobile
        function handleOpen() {
          if (smartsuppReady()) {
            openViaAPI();
          } else {
            // Smartsupp not loaded yet (common on mobile) — open in new tab
            openViaTab();
          }
        }

        // Use click for both PC and mobile (mobile browsers fire click too)
        btn.addEventListener('click', handleOpen);

      })();
    </script>

  </body>
</html>

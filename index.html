    <!-- Twitter Social Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quibands Global | Institutional-Grade Cryptocurrency Mining" />
    <meta name="twitter:description" content="Next-generation high-efficiency institutional crypto mining infrastructure. Real-time hashrate allocation, automated balance distribution, and multi-signature cold custody." />
    <meta name="twitter:image" content="/og-preview.png" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  </head>

  <body class="bg-dark-950 text-slate-100 font-sans antialiased selection:bg-gold-500/30 selection:text-gold-300 overflow-x-hidden min-h-screen w-full touch-pan-y">
    <!-- Google Translate Zero-Footprint Bridge Container -->
    <div id="google_translate_element" style="position: fixed; top: 0; left: 0; width: 0; height: 0; overflow: hidden; opacity: 0; pointer-events: none; z-index: -99999;"></div>

    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            autoDisplay: false,
            includedLanguages: 'en,zh-CN,zh-TW,ms,ta,es,de,fr,ja,ko,ar,pt,ru,vi,id,th,tl,tr,it',
            layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE
          }, 'google_translate_element');
        }
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Smartsupp Live Chat script -->
    <script type="text/javascript">
    var _smartsupp = _smartsupp || {};
    _smartsupp.key = '3cdeb6680f2bbdf23ceab58462afab7133653b98';
    _smartsupp.hideOffline = false;
    window.smartsupp||(function(d) {
      var s,c,o=smartsupp=function(){ o._.push(arguments)};o._=[];
      s=d.getElementsByTagName('script')[0];c=d.createElement('script');
      c.type='text/javascript';c.charset='utf-8';c.async=true;
      c.src='https://www.smartsuppchat.com/loader.js?';s.parentNode.insertBefore(c,s);
    })(document);
    </script>

    <!--
      GUARANTEED CHAT BUTTON
      All styles are 100% inline — no CSS class, no framework.
      Nothing in the project can override or hide this button.
    -->
    <button
      id="qb-live-chat"
      style="
        position:fixed !important;
        bottom:24px !important;
        right:24px !important;
        z-index:2147483647 !important;
        width:60px !important;
        height:60px !important;
        border-radius:50% !important;
        background:linear-gradient(135deg,#1d4ed8,#06b6d4) !important;
        border:none !important;
        outline:none !important;
        cursor:pointer !important;
        display:flex !important;
        align-items:center !important;
        justify-content:center !important;
        box-shadow:0 4px 24px rgba(29,78,216,0.7) !important;
        padding:0 !important;
        margin:0 !important;
        visibility:visible !important;
        opacity:1 !important;
        pointer-events:auto !important;
        transform:none !important;
        overflow:visible !important;
      "
      title="Live Support Chat"
      aria-label="Open live support chat"
    >
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none"
        stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"
        style="display:block !important; pointer-events:none !important;">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
    </button>

    <script>
      (function() {
        function openChat() {
          try {
            if (typeof window.smartsupp === 'function') {
              window.smartsupp('chat:open');
              return true;
            }
          } catch(e) {}
          return false;
        }

        var btn = document.getElementById('qb-live-chat');
        if (btn) {
          btn.addEventListener('click', function() {
            // Try immediately
            if (!openChat()) {
              // Smartsupp not ready yet — retry every 300ms for up to 5 seconds
              var attempts = 0;
              var interval = setInterval(function() {
                attempts++;
                if (openChat() || attempts >= 16) {
                  clearInterval(interval);
                }
              }, 300);
            }
          });

          // Also handle touchstart for mobile
          btn.addEventListener('touchstart', function(e) {
            e.preventDefault();
            btn.click();
          }, { passive: false });
        }
      })();
    </script>

  </body>
</html>

    <script type="text/javascript">
      function qbOpenLiveChat(e) {
        if (e) e.preventDefault();
        if (window.Tawk_API && typeof window.Tawk_API.maximize === 'function') {
          try { window.Tawk_API.maximize(); return false; } catch (err) {}
        }
        var count = 0;
        var interval = setInterval(function() {
          count++;
          if (window.Tawk_API && typeof window.Tawk_API.maximize === 'function') {
            try { window.Tawk_API.maximize(); } catch (err) {}
            clearInterval(interval);
          } else if (count > 15) {
            clearInterval(interval);
            window.open('https://tawk.to/chat/6aa19f6d8d649b3445c672c0/1k23ldiql', '_blank');
          }
        }, 150);
        return false;
      }
    </script>

    <button

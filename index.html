<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Quibands Global | Institutional-Grade Cryptocurrency Mining Platform</title>
    <meta name="description" content="Next-generation high-efficiency institutional crypto mining infrastructure. Transparent hashrate allocation, real-time yield distribution, and multi-signature cold storage security." />
    
    <!-- Open Graph / Facebook / WhatsApp / Telegram Social Previews -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Quibands Global" />
    <meta property="og:title" content="Quibands Global | Institutional-Grade Cryptocurrency Mining" />
    <meta property="og:description" content="Next-generation high-efficiency institutional crypto mining infrastructure. Real-time hashrate allocation, automated balance distribution, and multi-signature cold custody." />
    <meta property="og:image" content="/og-preview.png" />
    <meta property="og:image:secure_url" content="/og-preview.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Quibands Global Institutional Infrastructure" />

    <!-- Twitter Social Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Quibands Global | Institutional-Grade Cryptocurrency Mining" />
    <meta name="twitter:description" content="Next-generation high-efficiency institutional crypto mining infrastructure. Real-time hashrate allocation, automated balance distribution, and multi-signature cold custody." />
    <meta name="twitter:image" content="/og-preview.png" />

    <!-- Smartsupp Live Chat script -->
    <script type="text/javascript">
    var _smartsupp = _smartsupp || {};
    _smartsupp.key = '3cdeb6680f2bbdf23ceab58462afab7133653b98';
    _smartsupp.hideOffline = false;
    _smartsupp.chatBubble = true;
    window.smartsupp||(function(d) {
      var s,c,o=smartsupp=function(){ o._.push(arguments)};o._=[];
      s=d.getElementsByTagName('script')[0];c=d.createElement('script');
      c.type='text/javascript';c.charset='utf-8';c.async=true;
      c.src='https://www.smartsuppchat.com/loader.js?';s.parentNode.insertBefore(c,s);
    })(document);
    </script>
  </head>

  <body class="bg-dark-950 text-slate-100 font-sans antialiased selection:bg-gold-500/30 selection:text-gold-300 overflow-x-hidden min-h-screen w-full touch-pan-y">
    <!-- Google Translate Zero-Footprint Bridge Container -->
    <div id="google_translate_element" style="position: fixed; top: 0; left: 0; width: 0; height: 0; overflow: hidden; opacity: 0; pointer-events: none; z-index: -99999;"></div>

    <script type="text/javascript">
      function googleTranslateElementInit() {
        if (window.google && window.google.translate) {
          new window.google.translate.TranslateElement({
            pageLanguage: 'en',
            autoDisplay: false,
            includedLanguages: 'en,zh-CN,zh-TW,ms,ta,es,de,fr,ja,ko,ar,pt,ru,vi,id,th,tl,tr,it',
            layout: window.google.translate.TranslateElement.InlineLayout.SIMPLE
          }, 'google_translate_element');
        }
      }
    </script>
    <script type="text/javascript" src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Institutional Live Chat Floating System -->
    <div id="qb-support-modal" style="display: none; position: fixed; inset: 0; z-index: 2147483647; background: rgba(0,0,0,0.65); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);">
      <div style="position: absolute; bottom: 0; right: 0; width: 100%; max-width: 440px; height: 86vh; max-height: 720px; background: #0b1329; border-radius: 20px 20px 0 0; display: flex; flex-direction: column; overflow: hidden; box-shadow: 0 -12px 40px rgba(0,0,0,0.9); border: 1px solid rgba(255,255,255,0.12); font-family: 'Inter', system-ui, sans-serif;">
        <!-- Header -->
        <div style="display: flex; align-items: center; justify-content: space-between; padding: 14px 20px; background: #111e38; border-bottom: 1px solid rgba(255,255,255,0.08);">
          <div style="display: flex; align-items: center; gap: 10px;">
            <div style="width: 10px; height: 10px; border-radius: 50%; background: #10b981; box-shadow: 0 0 10px #10b981;"></div>
            <div>
              <div style="color: #ffffff; font-weight: 700; font-size: 15px; letter-spacing: -0.01em;">Quibands Support</div>
              <div style="color: #94a3b8; font-size: 11px;">Institutional Desk • Online</div>
            </div>
          </div>
          <button id="qb-support-close" type="button" style="background: rgba(255,255,255,0.1); border: none; color: #ffffff; width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 16px;">✕</button>
        </div>

        <!-- Chat Stream Messages -->
        <div id="qb-msg-stream" style="flex: 1; overflow-y: auto; padding: 18px; display: flex; flex-direction: column; gap: 14px; background: radial-gradient(circle at top, #131d36 0%, #090e1d 100%);">
          <div style="display: flex; gap: 10px; align-items: flex-start;">
            <div style="width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #1d4ed8, #06b6d4); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 13px; flex-shrink: 0;">QG</div>
            <div style="background: #1e293b; border: 1px solid rgba(255,255,255,0.08); color: #e2e8f0; padding: 12px 16px; border-radius: 4px 16px 16px 16px; font-size: 13px; line-height: 1.5; max-width: 82%;">
              Hello! Welcome to <strong>Quibands Global</strong> Institutional Support. How can we assist with your mining yields, deposits, or account operations today?
            </div>
          </div>
        </div>

        <!-- Input Bar -->
        <form id="qb-msg-form" style="display: flex; gap: 8px; padding: 14px; background: #111e38; border-top: 1px solid rgba(255,255,255,0.08);">
          <input id="qb-msg-input" type="text" placeholder="Type your message..." style="flex: 1; background: #1e293b; border: 1px solid rgba(255,255,255,0.15); color: #ffffff; padding: 12px 16px; border-radius: 12px; font-size: 14px; outline: none;" required autocomplete="off" />
          <button type="submit" style="background: linear-gradient(135deg, #2563eb, #06b6d4); border: none; color: #ffffff; padding: 0 18px; border-radius: 12px; cursor: pointer; font-weight: 600; font-size: 14px; display: flex; align-items: center; justify-content: center;">Send</button>
        </form>
      </div>
    </div>

    <!-- Floating Live Chat Trigger Button -->
    <button
      id="qb-live-chat-btn"
      type="button"
      style="
        position: fixed !important;
        bottom: 24px !important;
        right: 24px !important;
        width: 60px !important;
        height: 60px !important;
        border-radius: 50% !important;
        background: linear-gradient(135deg, #1d4ed8, #06b6d4) !important;
        border: none !important;
        outline: none !important;
        cursor: pointer !important;
        display: flex !important;
        align-items: center !important;
        justify-content: center !important;
        box-shadow: 0 6px 25px rgba(29, 78, 216, 0.75) !important;
        z-index: 2147483640 !important;
        -webkit-tap-highlight-color: transparent !important;
        touch-action: manipulation !important;
      "
      aria-label="Open Live Chat"
      title="Open Live Chat"
    >
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="pointer-events: none;">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
      </svg>
    </button>

    <script type="text/javascript">
      (function() {
        var modal = document.getElementById('qb-support-modal');
        var openBtn = document.getElementById('qb-live-chat-btn');
        var closeBtn = document.getElementById('qb-support-close');
        var form = document.getElementById('qb-msg-form');
        var input = document.getElementById('qb-msg-input');
        var stream = document.getElementById('qb-msg-stream');

        function openSupport() {
          // If on Desktop and Smartsupp is initialized, trigger Smartsupp
          if (window.smartsupp && window.innerWidth > 768) {
            try {
              window.smartsupp('chat:open');
              return;
            } catch(e) {}
          }
          if (modal) {
            modal.style.display = 'block';
            if (openBtn) openBtn.style.display = 'none';
            if (input) input.focus();
          }
        }

        function closeSupport() {
          if (modal) {
            modal.style.display = 'none';
            if (openBtn) openBtn.style.display = 'flex';
          }
        }

        if (openBtn) {
          openBtn.onclick = function(e) {
            if (e && e.preventDefault) e.preventDefault();
            openSupport();
          };
          openBtn.ontouchend = function(e) {
            if (e && e.preventDefault) e.preventDefault();
            openSupport();
          };
        }

        if (closeBtn) {
          closeBtn.onclick = closeSupport;
          closeBtn.ontouchend = closeSupport;
        }

        if (form) {
          form.onsubmit = function(e) {
            e.preventDefault();
            var text = input.value.trim();
            if (!text) return;

            // User Message bubble
            var userMsg = document.createElement('div');
            userMsg.style.display = 'flex';
            userMsg.style.justifyContent = 'flex-end';
            userMsg.innerHTML = '<div style="background: linear-gradient(135deg, #2563eb, #06b6d4); color: #ffffff; padding: 10px 16px; border-radius: 16px 16px 4px 16px; font-size: 13px; max-width: 82%; line-height: 1.4;">' + text.replace(/</g, "&lt;").replace(/>/g, "&gt;") + '</div>';
            stream.appendChild(userMsg);
            input.value = '';
            stream.scrollTop = stream.scrollHeight;

            // Transmit message to Smartsupp agent dashboard & mobile app
            if (typeof window.smartsupp === 'function') {
              try {
                window.smartsupp('chat:message', text);
                window.smartsupp('message:send', { text: text });
                window.smartsupp('event', 'message_sent', { text: text });
              } catch(e) {}
            }

            // Automated Help Desk Response
            setTimeout(function() {
              var reply = document.createElement('div');
              reply.style.display = 'flex';
              reply.style.gap = '10px';
              reply.style.alignItems = 'flex-start';
              reply.innerHTML = '<div style="width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, #1d4ed8, #06b6d4); display: flex; align-items: center; justify-content: center; color: white; font-weight: bold; font-size: 13px; flex-shrink: 0;">QG</div>' +
                '<div style="background: #1e293b; border: 1px solid rgba(255,255,255,0.08); color: #e2e8f0; padding: 12px 16px; border-radius: 4px 16px 16px 16px; font-size: 13px; line-height: 1.5; max-width: 82%;">' +
                'Thank you for reaching out. An institutional representative has received your ticket and will respond immediately.' +
                '</div>';
              stream.appendChild(reply);
              stream.scrollTop = stream.scrollHeight;
            }, 1000);
          };
        }
      })();
    </script>
  </body>
</html>
